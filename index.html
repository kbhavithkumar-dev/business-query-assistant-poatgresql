<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Business Data Query Assistant</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div class="topbar"><span class="brand">▥ &nbsp; Business Query</span></div>
  <main>
    <header>
      <p class="section-name">Sales reporting</p>
      <h1>Business Data Query Assistant</h1>
      <p>Ask about orders, products, or revenue in plain English.</p>
    </header>
    <div class="workspace">
      <aside class="card samples" aria-labelledby="examples-title">
        <h2 id="examples-title">Example questions</h2>
        <div id="examples"></div>
        <p id="mode" hidden>Demo mode runs these examples using sample sales.</p>
      </aside>
      <div class="work-area">
        <section class="card" aria-labelledby="question-label">
      <form id="question-form">
        <label id="question-label" for="question">Your question</label>
        <textarea id="question" rows="3" maxlength="500" required placeholder="Which region made the most revenue?"></textarea>
        <button id="ask-button" class="primary">Run query</button>
      </form>
      <p id="status" role="status"></p>
    </section>
    <section id="result" class="card" aria-labelledby="result-title" hidden>
      <div class="result-header">
        <h2 id="result-title">Query result</h2>
        <span id="row-count"></span>
      </div>
      <p id="summary"></p>
      <div class="table-wrap" tabindex="0" aria-label="Query results">
        <table aria-label="Query results">
          <thead><tr id="columns"></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <details>
        <summary>View SQL</summary>
        <pre><code id="sql"></code></pre>
      </details>
    </section>
      </div>
    </div>
  </main>
</body>
</html>
